<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>
    <section id="s1">
        <h1>title1</h1>
        <ul class="list">
            <li>list</li>
        </ul>
    </section>
    <section id="s2">
        <h1>title2</h1>
        <ul class="list">
            <li   data-aos="fade-up">list</li>
            <li   data-aos="fade-up"   data-aos-delay="50">list</li>
            <li   data-aos="fade-up"   data-aos-delay="100">list</li>
            <li   data-aos="fade-up"   data-aos-delay="150">list</li>
        </ul>
    </section>
    <section id="s3">
        <h1 data-aos="fade-right">title3</h1>
        <ul class="list">
            <li data-aos="fade-left">list</li>
            <li data-aos="fade-left" data-aos-delay="50">list</li>
            <li data-aos="fade-left" data-aos-delay="100">list</li>
            <li data-aos="fade-left" data-aos-delay="150">list</li>
            <li data-aos="fade-left" data-aos-delay="200">list</li>
            <li data-aos="fade-left" data-aos-delay="250">list</li>
        </ul>
    </section>
    <section id="s4">
        <h1>title4</h1>
        <ul class="list">
            <li data-aos="flip-right" data-aos-delay="0">list</li>
            <li data-aos="flip-right" data-aos-delay="50">list</li>
            <li data-aos="flip-right" data-aos-delay="100">list</li>
        </ul>
    </section>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

    <script src="./js/app.js"></script>
</body>

</html>
