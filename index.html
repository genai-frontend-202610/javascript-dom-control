<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
</head>

<body>
    <div id="wrap">
        <section>

            <ul class="guide-tabs">
                <li ><button type="button">🌌 별자리</button></li>
                <li ><button type="button">🪐 행성</button></li>
                <li ><button type="button">🔭 장비</button></li>
                <li ><button type="button">⛺ 관측 장소</button></li>
            </ul>
            <ol class="guide-content">
                <li >
                    <span class="badge">입문 추천</span>
                    <span class="num">01</span>
                    <div class="thumb">🌌</div>
                    <div class="txt-wrap">
                        <h3>계절 별자리 찾기</h3>
                        <p>북두칠성에서 시작해<br>계절마다 바뀌는 길잡이 별을 찾아요.</p>
                    </div>
                </li>
                <li >
                    <span class="badge">이번 달</span>
                    <span class="num">02</span>
                    <div class="thumb">🪐</div>
                    <div class="txt-wrap">
                        <h3>맨눈으로 보는 행성</h3>
                        <p>금성·목성·토성,<br>반짝이지 않으면 행성이에요.</p>
                    </div>
                </li>
                <li>
                    <span class="badge">준비물</span>
                    <span class="num">03</span>
                    <div class="thumb">🔭</div>
                    <div class="txt-wrap">
                        <h3>처음 장비 고르기</h3>
                        <p>쌍안경 → 소형 망원경 →<br>별자리 앱 순서로 시작해요.</p>
                    </div>
                </li>
                <li >
                    <span class="badge">주말 코스</span>
                    <span class="num">04</span>
                    <div class="thumb">⛺</div>
                    <div class="txt-wrap">
                        <h3>어두운 곳 찾기</h3>
                        <p>천문대, 캠핑장, 바닷가.<br>빛 공해 지도 보는 법까지.</p>
                    </div>
                </li>
            </ol>
        </section>
    </div>
    <script src="./js/app.js"></script>
</body>

</html>
